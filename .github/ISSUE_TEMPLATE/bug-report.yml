name: Website or documentation issue
description: Report a broken link, layout issue, or documentation problem.
title: "[ISSUE] "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Website / layout
        - Mobile / accessibility
        - Technical documentation
        - Broken link
        - Translation
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include steps to reproduce and expected behavior.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device (optional)
